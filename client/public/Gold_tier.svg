<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      /* --- GLOBAL TRANSFORM RESET & EASE --- */
      .anim-node {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* --- 1. AMBIENT GLOW & RING --- */
      .bg-glow {
        opacity: 0;
        animation: glowFade 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0s forwards;
      }
      .glow-ring {
        opacity: 0;
        animation: ringExpand 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.1s forwards;
      }

      /* --- 2. BADGE ENTRANCE (Scale 0.92 -> 1.04 -> 1.0) --- */
      .badge-group {
        opacity: 0;
        animation: badgePop 0.65s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
      }

      /* --- 3. EMBLEM STAMP --- */
      .emblem {
        opacity: 0;
        animation: emblemStamp 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.65s forwards;
      }

      /* --- 4. SHIMMER SWEEP --- */
      .shimmer-pass {
        animation: shimmerSweep 0.65s cubic-bezier(0.23, 1, 0.32, 1) 1.1s forwards;
      }

      /* --- 5. STAGGERED PARTICLES --- */
      .particle {
        opacity: 0;
        animation: particleBurst 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      
      /* Radial angles & staggered delays */
      .p-1  { animation-delay: 0.75s; --tx: 0px;   --ty: -75px; }
      .p-2  { animation-delay: 0.78s; --tx: 40px;  --ty: -65px; }
      .p-3  { animation-delay: 0.82s; --tx: 70px;  --ty: -30px; }
      .p-4  { animation-delay: 0.76s; --tx: 75px;  --ty: 20px;  }
      .p-5  { animation-delay: 0.85s; --tx: 45px;  --ty: 60px;  }
      .p-6  { animation-delay: 0.80s; --tx: 0px;   --ty: 75px;  }
      .p-7  { animation-delay: 0.83s; --tx: -45px; --ty: 60px;  }
      .p-8  { animation-delay: 0.77s; --tx: -75px; --ty: 20px;  }
      .p-9  { animation-delay: 0.84s; --tx: -70px; --ty: -30px; }
      .p-10 { animation-delay: 0.79s; --tx: -40px; --ty: -65px; }

      /* --- KEYFRAMES --- */
      @keyframes glowFade {
        0%   { opacity: 0; transform: scale(0.6); }
        100% { opacity: 0.45; transform: scale(1); }
      }

      @keyframes ringExpand {
        0%   { opacity: 0.8; transform: scale(0.4); stroke-width: 4px; }
        100% { opacity: 0; transform: scale(1.3); stroke-width: 0.5px; }
      }

      @keyframes badgePop {
        0%   { opacity: 0; transform: scale(0.92); }
        70%  { opacity: 1; transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes emblemStamp {
        0%   { opacity: 0; transform: scale(1.4); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes shimmerSweep {
        0%   { transform: translateX(-120px) rotate(25deg); opacity: 0; }
        20%  { opacity: 0.8; }
        80%  { opacity: 0.8; }
        100% { transform: translateX(120px) rotate(25deg); opacity: 0; }
      }

      @keyframes particleBurst {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.3);
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(1);
        }
      }

      /* --- REDUCED MOTION --- */
      @media (prefers-reduced-motion: reduce) {
        .bg-glow, .badge-group, .emblem {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .glow-ring, .shimmer-pass, .particle {
          display: none !important;
        }
      }
    </style>

    <!-- GRADIENTS -->
    <radialGradient id="bgGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54A" />
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7E0" />
      <stop offset="30%" stop-color="#FFD54A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#855B00" />
    </linearGradient>

    <linearGradient id="goldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A6B02" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFF7E0" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- CLIP PATHS & SHAPES -->
    <path id="hexPath" d="M 160 92 L 218.8 126 L 218.8 194 L 160 228 L 101.2 194 L 101.2 126 Z" />
    
    <clipPath id="badgeClip">
      <use href="#hexPath" />
    </clipPath>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#543000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. BACKDROP GLOWS -->
  <circle class="anim-node bg-glow" cx="160" cy="160" r="130" fill="url(#bgGlowGrad)" />
  <circle class="anim-node glow-ring" cx="160" cy="160" r="100" fill="none" stroke="#FFD54A" />

  <!-- 2. PARTICLES BURST (BEHIND BADGE EDGE) -->
  <g id="particles">
    <circle class="anim-node particle p-1" cx="160" cy="160" r="3" fill="#FFF7E0" />
    <path class="anim-node particle p-2" fill="#FFD54A" d="M160 157 L161.5 160 L164.5 160 L162 161.5 L163 164.5 L160 162.5 L157 164.5 L158 161.5 L155.5 160 L158.5 160 Z" />
    <circle class="anim-node particle p-3" cx="160" cy="160" r="2.5" fill="#F59E0B" />
    <circle class="anim-node particle p-4" cx="160" cy="160" r="3.5" fill="#FFF7E0" />
    <path class="anim-node particle p-5" fill="#FBBF24" d="M160 157 L161.5 160 L164.5 160 L162 161.5 L163 164.5 L160 162.5 L157 164.5 L158 161.5 L155.5 160 L158.5 160 Z" />
    <circle class="anim-node particle p-6" cx="160" cy="160" r="3" fill="#FFD54A" />
    <circle class="anim-node particle p-7" cx="160" cy="160" r="2" fill="#FFF7E0" />
    <path class="anim-node particle p-8" fill="#FFD54A" d="M160 157 L161.5 160 L164.5 160 L162 161.5 L163 164.5 L160 162.5 L157 164.5 L158 161.5 L155.5 160 L158.5 160 Z" />
    <circle class="anim-node particle p-9" cx="160" cy="160" r="3" fill="#FBBF24" />
    <circle class="anim-node particle p-10" cx="160" cy="160" r="2.5" fill="#FFF7E0" />
  </g>

  <!-- 3. MAIN BADGE -->
  <g class="anim-node badge-group" filter="url(#badgeShadow)">
    <!-- Outer Bevel -->
    <use href="#hexPath" fill="url(#goldOuter)" />
    <!-- Inner Inset -->
    <path d="M 160 101 L 210.2 130 L 210.2 189 L 160 218 L 109.8 189 L 109.8 130 Z" fill="url(#goldInner)" stroke="#FFF7E0" stroke-opacity="0.5" stroke-width="1" />

    <!-- Surface Shimmer Band -->
    <g clip-path="url(#badgeClip)">
      <rect class="anim-node shimmer-pass" x="140" y="80" width="35" height="180" fill="url(#shimmerGrad)" />
    </g>

    <!-- 4. CENTER CROWN EMBLEM -->
    <g class="anim-node emblem">
      <path d="M 136 170 L 130 144 L 143 155 L 160 136 L 177 155 L 190 144 L 184 170 Z" fill="#FFF7E0" stroke="#9A6B02" stroke-width="1" stroke-linejoin="round" />
      <circle cx="130" cy="142" r="2" fill="#FFFFFF" />
      <circle cx="160" cy="133" r="2.5" fill="#FFFFFF" />
      <circle cx="190" cy="142" r="2" fill="#FFFFFF" />
      <!-- Star Accent -->
      <path d="M160 180 L161.5 184 L165.5 184.5 L162.5 187 L163.5 191 L160 189 L156.5 191 L157.5 187 L154.5 184.5 L158.5 184 Z" fill="#FFF7E0" />
    </g>
  </g>
</svg>
