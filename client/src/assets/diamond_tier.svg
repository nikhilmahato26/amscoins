<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      /* --- Motion Philosophy & Setup --- */
      /* Easing Tokens */
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }

      /* Base transform origin setup for SVG child nodes */
      .origin-center {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* 1. Background Radial Light Bloom (0.0s - 0.8s) */
      .bg-glow {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: bloom 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      .ray-fan {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: rayFade 1.0s ease-out forwards;
      }

      /* 2. Facet Shards Fly-In Assembly (0.4s - 1.2s) */
      .shard {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: assemble 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      .s-top-left  { --tx: -70px; --ty: -50px; --r: -20deg; animation-delay: 0.40s; }
      .s-top-mid   { --tx: 0px;   --ty: -80px; --r: 0deg;    animation-delay: 0.43s; }
      .s-top-right { --tx: 70px;  --ty: -50px; --r: 20deg;   animation-delay: 0.46s; }
      .s-mid-left  { --tx: -80px; --ty: 10px;  --r: -30deg;  animation-delay: 0.42s; }
      .s-table     { --tx: 0px;   --ty: -25px; --r: 0deg;    animation-delay: 0.50s; }
      .s-mid-right { --tx: 80px;  --ty: 10px;  --r: 30deg;   animation-delay: 0.48s; }
      .s-bottom    { --tx: 0px;   --ty: 90px;  --r: 0deg;    animation-delay: 0.45s; }

      /* 3. Internal Wireframe Line Draw (1.0s - 1.6s) */
      .facet-wire {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: strokeDraw 0.6s cubic-bezier(0.23, 1, 0.32, 1) 1.0s forwards;
      }

      /* 4. Prismatic Glint Sweep (1.3s - 2.1s) */
      .glint-clip {
        clip-path: url(#gem-clip);
      }
      .glint-bar {
        opacity: 0;
        animation: glintSweep 0.8s cubic-bezier(0.77, 0, 0.175, 1) 1.3s forwards;
      }

      /* 5. Sparkles (1.4s+ & 2.2s resting) */
      .sparkle-tr {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: sparkleTwinkle 0.8s cubic-bezier(0.23, 1, 0.32, 1) 1.4s forwards;
      }
      .sparkle-resting {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: sparkleSoft 0.6s cubic-bezier(0.23, 1, 0.32, 1) 2.2s forwards;
      }

      /* 6. Elegant Floating Dust Particles (1.6s - 2.2s) */
      .particle {
        opacity: 0;
        animation: floatUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      .p1 { --px: 130px; --py: 200px; --pdx: -10px; --pdy: -30px; animation-delay: 1.60s; }
      .p2 { --px: 190px; --py: 190px; --pdx: 12px;  --pdy: -35px; animation-delay: 1.68s; }
      .p3 { --px: 105px; --py: 150px; --pdx: -12px; --pdy: -25px; animation-delay: 1.64s; }
      .p4 { --px: 215px; --py: 140px; --pdx: 14px;  --pdy: -25px; animation-delay: 1.72s; }
      .p5 { --px: 160px; --py: 220px; --pdx: 0px;    --pdy: -40px; animation-delay: 1.76s; }

      /* Keyframe Definitions */
      @keyframes bloom {
        0%   { transform: scale(0.85); opacity: 0; }
        60%  { opacity: 0.8; }
        100% { transform: scale(1); opacity: 0.45; }
      }
      @keyframes rayFade {
        0%   { opacity: 0; transform: scale(0.7) rotate(0deg); }
        50%  { opacity: 0.35; }
        100% { opacity: 0; transform: scale(1.15) rotate(8deg); }
      }
      @keyframes assemble {
        0% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(0.92);
        }
        70% {
          opacity: 1;
          transform: translate(0, 0) rotate(0deg) scale(1.02);
        }
        100% {
          opacity: 1;
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
      }
      @keyframes strokeDraw {
        0%   { stroke-dashoffset: 1; opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.35; }
      }
      @keyframes glintSweep {
        0%   { transform: translateX(-150px) skewX(-25deg); opacity: 0; }
        20%  { opacity: 0.85; }
        80%  { opacity: 0.85; }
        100% { transform: translateX(180px) skewX(-25deg); opacity: 0; }
      }
      @keyframes sparkleTwinkle {
        0%   { transform: scale(0.85) rotate(0deg); opacity: 0; }
        50%  { transform: scale(1.2) rotate(45deg); opacity: 1; }
        100% { transform: scale(1) rotate(90deg); opacity: 0.9; }
      }
      @keyframes sparkleSoft {
        0%   { transform: scale(0.85); opacity: 0; }
        50%  { transform: scale(1.1); opacity: 0.6; }
        100% { transform: scale(1); opacity: 0.4; }
      }
      @keyframes floatUp {
        0%   { transform: translate(0, 0); opacity: 0; }
        40%  { opacity: 0.6; }
        100% { transform: translate(var(--pdx), var(--pdy)); opacity: 0; }
      }

      /* Reduced Motion Accessibility */
      @media (prefers-reduced-motion: reduce) {
        .bg-glow, .ray-fan, .shard, .facet-wire, .glint-bar, .sparkle-tr, .sparkle-resting, .particle {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          stroke-dashoffset: 0 !important;
        }
        .bg-glow { opacity: 0.45 !important; }
        .ray-fan, .glint-bar, .particle { opacity: 0 !important; }
        .facet-wire { opacity: 0.35 !important; }
        .sparkle-resting { opacity: 0.4 !important; }
      }
    </style>

    <!-- Background Light Bloom Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rayGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#A5B4FC" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Crystalline Facet Gradients -->
    <linearGradient id="g-top-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <linearGradient id="g-top-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="g-top-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <linearGradient id="g-table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="g-mid-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <linearGradient id="g-mid-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <linearGradient id="g-bottom" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Glint Gradient -->
    <linearGradient id="glintGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#C4B5FD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Diamond Geometry Clip Path -->
    <clipPath id="gem-clip">
      <polygon points="160,225 95,145 115,100 205,100 225,145" />
    </clipPath>

    <!-- Soft Base Glow for Rest State -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 0.0s - 0.8s: Background Radial Bloom & Rays -->
  <g>
    <circle class="bg-glow" cx="160" cy="145" r="110" fill="url(#bgGlow)" />
    
    <g class="ray-fan">
      <path d="M160,145 L120,20 L135,18 Z" fill="url(#rayGrad)" />
      <path d="M160,145 L185,15 L200,20 Z" fill="url(#rayGrad)" />
      <path d="M160,145 L260,80 L268,95 Z" fill="url(#rayGrad)" />
      <path d="M160,145 L275,160 L270,175 Z" fill="url(#rayGrad)" />
      <path d="M160,145 L50,170 L45,155 Z" fill="url(#rayGrad)" />
      <path d="M160,145 L60,85 L70,72 Z" fill="url(#rayGrad)" />
    </g>
  </g>

  <!-- Gem Body Group -->
  <g filter="url(#soft-glow)">
    <!-- 0.4s - 1.2s: Facet Shards -->
    <polygon class="shard s-top-left" points="115,100 140,100 128,122 95,145" fill="url(#g-top-left)" />
    <polygon class="shard s-top-mid" points="140,100 160,100 160,122 128,122" fill="url(#g-top-mid)" />
    <polygon class="shard s-top-right" points="160,100 205,100 225,145 192,122 160,122" fill="url(#g-top-right)" />
    <polygon class="shard s-table" points="128,122 160,100 192,122 160,122" fill="url(#g-table)" opacity="0.95" />
    <polygon class="shard s-mid-left" points="95,145 128,122 160,145" fill="url(#g-mid-left)" />
    <polygon class="shard s-mid-right" points="192,122 225,145 160,145" fill="url(#g-mid-right)" />
    <polygon class="shard s-bottom" points="95,145 160,145 225,145 160,225" fill="url(#g-bottom)" />

    <!-- 1.0s - 1.6s: Internal Wireframe Draw -->
    <g stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path class="facet-wire" d="M115,100 L205,100 L225,145 L160,225 L95,145 Z" pathLength="1" />
      <path class="facet-wire" d="M115,100 L128,122 L160,145 L192,122 L205,100" pathLength="1" />
      <path class="facet-wire" d="M128,122 L192,122" pathLength="1" />
      <path class="facet-wire" d="M140,100 L128,122" pathLength="1" />
      <path class="facet-wire" d="M160,100 L160,145" pathLength="1" />
      <path class="facet-wire" d="M95,145 L160,145 L225,145" pathLength="1" />
      <path class="facet-wire" d="M160,145 L160,225" pathLength="1" />
    </g>

    <!-- 1.3s - 2.1s: Prismatic Glint Sweep -->
    <g class="glint-clip">
      <rect class="glint-bar" x="90" y="90" width="35" height="150" fill="url(#glintGrad)" />
    </g>
  </g>

  <!-- 1.6s - 2.2s: Floating Particles -->
  <g id="particles">
    <circle class="particle p1" cx="130" cy="200" r="1.5" fill="#E0F2FE" />
    <circle class="particle p2" cx="190" cy="190" r="2.0" fill="#FFFFFF" />
    <circle class="particle p3" cx="105" cy="150" r="1.2" fill="#7DD3FC" />
    <circle class="particle p4" cx="215" cy="140" r="1.8" fill="#C4B5FD" />
    <circle class="particle p5" cx="160" cy="220" r="1.0" fill="#FFFFFF" />
  </g>

  <!-- Sparkles -->
  <g class="sparkle-tr">
    <path d="M215,115 Q215,100 215,100 Q215,115 230,115 Q215,115 215,130 Q215,115 200,115 Q215,115 215,100" fill="#FFFFFF" />
    <circle cx="215" cy="115" r="2.5" fill="#E0F2FE" />
  </g>

  <g class="sparkle-resting">
    <path d="M105,165 Q105,156 105,156 Q105,165 114,165 Q105,165 105,174 Q105,165 96,165 Q105,165 105,156" fill="#FFFFFF" />
  </g>
</svg>
