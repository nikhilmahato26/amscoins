<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover lets the fixed mobile CTA bar sit against the bottom
      edge on notched phones, with env(safe-area-inset-bottom) doing the inset.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="ASM Coins is an investment platform for people across India, with clear plan terms, instant withdrawals to UPI and support every day."
    />
    <title>ASM Coins — Smart investment, secure future</title>

    <!-- DNS-prefetch + preconnect for Google Fonts CDN -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Satoshi (display headings) via Fontshare -->
    <link rel="dns-prefetch" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!--
      Non-blocking font loading: preload as stylesheet, swap to real stylesheet
      on load. Fallback noscript tag ensures fonts still load without JS.
    -->
    <!-- Satoshi display font (replaces Fraunces — cleaner, more contemporary fintech feel) -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:wght@500;700;800&family=DM+Serif+Display&family=Playfair+Display:wght@700&family=Lobster&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:wght@500;700;800&family=DM+Serif+Display&family=Playfair+Display:wght@700&family=Lobster&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
