# Nginx site config for ASM Coins — path-based API (/api/... on the same
# domain as the frontend), so one cert and no CORS config needed.
#
# Fresh install:
#   sudo cp deploy/nginx/amscoins.conf /etc/nginx/sites-available/amscoins.conf
#   sudo ln -s /etc/nginx/sites-available/amscoins.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d asmcoins.com -d www.asmcoins.com
#
# This copy already reflects what certbot produced on the live box (2026-08-15):
# the plain-HTTP server block now 404s except for the ACME challenge path and
# redirects everything else to :443 ("managed by Certbot" blocks below — don't
# hand-edit those, `certbot renew` rewrites this file in place on its own).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    # default_server: lets this respond on the bare IP too, not just the domain.
    server_name asmcoins.com www.asmcoins.com;

    root /opt/amscoins/client/dist;
    index index.html;

    # Backend health check, bypassed from the rate-limit zone so uptime
    # monitors / deploy scripts don't get 429'd.
    # NOTE: proxy_pass here has NO trailing path component, so nginx forwards
    # the original request URI unchanged (/api/health -> backend /api/health).
    # server/src/app.js mounts all routes under app.use('/api', ...), so a
    # trailing "/" here (making nginx rewrite /api/health -> /health) would
    # 404 against the real Express mount point.
    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/asmcoins.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/asmcoins.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.asmcoins.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = asmcoins.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name asmcoins.com www.asmcoins.com;
    return 404; # managed by Certbot
}
